; Type-checking configuration for the two Python entry points the `python`
; language gate checks (see scripts/languages/check.mjs).
;
; RNS, LXMF and Pillow are optional runtime dependencies: the vector generator
; imports the pinned Python Reticulum/LXMF references, which are installed only
; in the interop environments, and the launcher imports Pillow lazily behind a
; feature check. None of the three ships type stubs, and none is published on
; typeshed, so mypy can only report them as missing. Ignoring the missing
; imports keeps their call sites checked as `Any` rather than unchecked.

[mypy]

[mypy-RNS.*]
ignore_missing_imports = True

[mypy-RNS]
ignore_missing_imports = True

[mypy-LXMF.*]
ignore_missing_imports = True

[mypy-LXMF]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-PIL]
ignore_missing_imports = True

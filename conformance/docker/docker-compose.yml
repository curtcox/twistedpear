services:
  reference:
    build:
      context: ../..
      dockerfile: conformance/docker/Dockerfile
    command: python -c "import RNS; print('RNS reference peer placeholder ready')"

  leaf-echo:
    build:
      context: ../..
      dockerfile: conformance/docker/Dockerfile
    working_dir: /conformance/scenarios/python
    command: python leaf_echo.py
    ports:
      - "4242:4242"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',4242),1); s.close()"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  lxmf-echo:
    build:
      context: ../..
      dockerfile: conformance/docker/Dockerfile
    working_dir: /conformance/scenarios/python
    command: python lxmf_echo.py
    ports:
      - "4243:4242"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',4242),1); s.close()"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  link-echo:
    build:
      context: ../..
      dockerfile: conformance/docker/Dockerfile
    working_dir: /conformance/scenarios/python
    command: python link_echo.py
    ports:
      - "4244:4242"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',4242),1); s.close()"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  auto-interop:
    build:
      context: ../..
      dockerfile: conformance/docker/Dockerfile
    working_dir: /conformance/scenarios/python
    command: python auto_interop.py
    network_mode: host
    healthcheck:
      test: ["CMD", "python", "-c", "print('auto-interop-ready')"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  i2pd:
    image: purplei2p/i2pd:latest
    command:
      - --sam.enabled=true
      - --sam.address=0.0.0.0
      - --sam.port=7656
      - --loglevel=info
    ports:
      - "7656:7656"

  transport-leaf-bob:
    build:
      context: ../..
      dockerfile: conformance/docker/Dockerfile
    working_dir: /conformance/scenarios/python
    command: python transport_leaf.py --role echo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TRANSPORT_HUB_HOST: host.docker.internal
      TRANSPORT_HUB_PORT: "4250"
    healthcheck:
      test: ["CMD", "python", "-c", "print('transport-leaf-bob-ready')"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  transport-leaf-alice:
    build:
      context: ../..
      dockerfile: conformance/docker/Dockerfile
    working_dir: /conformance/scenarios/python
    command: python transport_leaf.py --role pinger
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TRANSPORT_HUB_HOST: host.docker.internal
      TRANSPORT_HUB_PORT: "4250"
    healthcheck:
      test: ["CMD", "python", "-c", "print('transport-leaf-alice-ready')"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  i2p-interop:
    build:
      context: ../..
      dockerfile: conformance/docker/Dockerfile
    depends_on:
      - i2pd
    environment:
      I2P_SAM_ADDRESS: i2pd:7656
    working_dir: /conformance/scenarios/python
    command: python i2p_interop.py
    volumes:
      - ../scenarios/state:/conformance/scenarios/state
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(0 if Path('/conformance/scenarios/state/i2p-b32.txt').is_file() else 1)"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 30s

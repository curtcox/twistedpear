<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TwistedPear Host</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>TwistedPear Host</h1>
      <p id="subtitle">Desktop always-on peer</p>
    </header>
    <main>
      <section class="panel">
        <h2>Node status</h2>
        <dl id="status-grid"></dl>

      <section class="panel">
        <h2>Mini-app</h2>
        <div id="widget-root"></div>

      <section class="panel">
        <h2>Log</h2>
        <pre id="log"></pre>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>

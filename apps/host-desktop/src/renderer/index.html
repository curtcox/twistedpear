<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TwistedPear Host</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>TwistedPear Host</h1>
      <p id="subtitle">Desktop always-on peer</p>
    </header>
    <main>
      <section class="panel">
        <h2>Node status</h2>
        <dl id="status-grid"></dl>
      </section>
      <section class="panel">
        <h2>Catalog</h2>
        <ul id="catalog-list" class="item-list"></ul>
        <div class="settings-grid">
          <label>
            Install from 256t string
            <input type="text" id="install-256t-input" placeholder="94-character 256t id" class="setting-input" />
          </label>
          <div class="item-row">
            <button id="install-256t">Install</button>
          </div>
        </div>
      </section>
      <section class="panel">
        <h2>Installed</h2>
        <ul id="installed-list" class="item-list"></ul>
      </section>
      <section class="panel">
        <h2>Grants</h2>
        <div id="grants-panel" class="grants-panel"></div>
      </section>
      <section class="panel">
        <h2>Trusted publishers</h2>
        <ul id="trust-list" class="item-list"></ul>
        <div class="settings-grid">
          <label>
            Publisher identity (94-char 256t string)
            <input type="text" id="trust-identity-input" class="setting-input" />
          </label>
          <label>
            Label
            <input type="text" id="trust-label-input" placeholder="Alice" class="setting-input" />
          </label>
          <div class="item-row">
            <button id="trust-add">Trust publisher</button>
            <button id="trust-show">Show my identity</button>
          </div>
          <div id="trust-identity-view"></div>
        </div>
      </section>
      <section class="panel">
        <h2>Settings</h2>
        <div class="settings-grid">
          <label><input type="checkbox" id="setting-propagation" /> Propagation node</label>
          <label><input type="checkbox" id="setting-developer" /> Developer mode</label>
          <label><input type="checkbox" id="setting-tcp" checked /> TCP client</label>
          <label><input type="checkbox" id="setting-auto" checked /> Auto (LAN)</label>
          <label>
            RNode port
            <input type="text" id="setting-rnode-port" placeholder="/dev/ttyUSB0" class="setting-input" />
          </label>
          <label>
            AI endpoint (OpenRouter-compatible)
            <input type="text" id="setting-ai-url" placeholder="https://openrouter.ai/api/v1" class="setting-input" />
          </label>
          <label>
            AI API key
            <input type="password" id="setting-ai-key" class="setting-input" />
          </label>
          <label>
            AI model
            <input type="text" id="setting-ai-model" placeholder="anthropic/claude-sonnet-5" class="setting-input" />
          </label>
        </div>
      </section>
      <section class="panel">
        <h2>Mini-app</h2>
        <div id="widget-root"></div>
      </section>
      <section class="panel">
        <h2>Dev preview</h2>
        <div class="item-row">
          <button id="stop-preview">Stop preview</button>
        </div>
        <div id="preview-root"></div>
      </section>
      <section class="panel">
        <h2>Runtime controls</h2>
        <div id="limits-panel" class="settings-grid">
          <p id="limits-app" class="muted">No mini-app selected</p>
          <label>
            Broker messages/second
            <input type="number" id="limit-rate" min="1" class="setting-input" />
          </label>
          <label>
            KV quota (bytes)
            <input type="number" id="limit-kv" min="0" class="setting-input" />
          </label>
          <label>
            Memory (bytes, applies on next launch)
            <input type="number" id="limit-memory" min="1" class="setting-input" />
          </label>
          <p id="limits-note" class="muted"></p>
          <div class="item-row">
            <button id="limits-apply">Apply limits</button>
            <button id="force-quit" class="danger">Force quit</button>
          </div>
        </div>
      </section>
      <section class="panel">
        <h2>Log</h2>
        <pre id="log"></pre>
      </section>
    </main>
    <div id="host-modal-overlay" class="modal-overlay" hidden>
      <div id="host-modal" class="modal" role="dialog" aria-modal="true"></div>
    </div>
    <script src="./vendor/qrcode.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>

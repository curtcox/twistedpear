# Network calls with no deadline.
#
# A fetch without an AbortSignal does not fail — it waits. On a mesh transport
# where the peer may simply be gone, "waits" means the caller's state machine
# stops advancing and nothing reports why. The type checker is perfectly happy.
#
# Accept a `signal` / `timeout` identifier, an AbortSignal.timeout(...) call,
# or a property named `signal`/`timeout`. Property keys are
# `property_identifier` nodes, so a bare `signal` pattern does not match
# `signal: AbortSignal.timeout(n)` — that form has to be named explicitly.
id: fetch-without-abort-signal
language: TypeScript
severity: hint
message: fetch() with no AbortSignal or timeout — this request can hang indefinitely.
rule:
  pattern: fetch($$$ARGS)
  not:
    has:
      stopBy: end
      any:
        - pattern: signal
        - pattern: timeout
        - pattern: AbortSignal.timeout($MS)
        - kind: property_identifier
          regex: ^(signal|timeout)$

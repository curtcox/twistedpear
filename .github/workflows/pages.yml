name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Verify TLA+ tools
        run: echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  formal/tla2tools.jar" | sha1sum --check
      - name: Run checks and capture reports
        run: npm run site:reports
      - name: Report pending user-guide screenshots
        run: npm run site:guide-images:report
      - name: Build documentation site
        run: npm run site:build
      - name: Verify the user guide was published
        run: node scripts/site/verify-guide.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-results
          path: site-results
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  aggregate:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-results
          path: site-results
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail if reported checks failed
        run: |
          node -e "
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('site-results/summary.json', 'utf8'));
          if (summary.ok) {
            console.log('All reported checks passed');
            process.exit(0);
          }
          console.error('Reported checks failed:', (summary.failed || []).join(', '));
          process.exit(1);
          "

name: Pages

# This workflow's status answers one question: did the site publish? Reported
# gate results are evaluated by the Site checks workflow (site-checks.yml),
# which runs after this one, so a gate finding can never make a successful
# publish look like a failed one.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: read

concurrency:
  group: pages
  # Let in-flight builds finish. The freshness job already refuses to publish a
  # superseded commit, so cancelling here only threw away work that was about to
  # deploy.
  cancel-in-progress: false

jobs:
  static-analysis-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      java-matrix: ${{ steps.plan.outputs.java-matrix }}
      imports: ${{ steps.plan.outputs.imports }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - id: plan
        run: node scripts/checks/pages-plan.mjs >> "$GITHUB_OUTPUT"

  static-analysis-evidence:
    needs: static-analysis-plan
    name: Published metric — ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.static-analysis-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        if: matrix.id == 'visual-regression'
        run: npx playwright install chromium
      - name: Install SwiftLint
        if: matrix.id == 'swift'
        run: |
          brew install swiftlint
          test "$(swiftlint version)" = "0.65.0"
      - name: Install lizard
        if: matrix.id == 'hotspots'
        run: python3 -m pip install lizard==1.23.0
      # JVM/Android setup lives on static-analysis-evidence-java. GitHub
      # downloads every `uses:` at job start, `if:` or not, and listing
      # setup-java here 429'd provenance and benchmark publishes.
      - name: Install the fuzzing toolchain
        if: matrix.id == 'rust-fuzz'
        # Same two-toolchain install as nightly.yml: cargo-fuzz needs nightly
        # for `-Z sanitizer`, and the contracts themselves are the stable pin.
        # Copies of `tool-versions.json`; `conformance/checks/tool-versions.test.mjs`
        # fails when they drift.
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup toolchain install nightly-2026-06-01 --profile minimal
          cargo install cargo-fuzz --version 0.13.1 --locked
      - name: Run metric-producing gate
        run: node scripts/checks/run.mjs --tier=${{ matrix.tier }} --only=${{ matrix.id }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Stage metric evidence with repository-relative paths
        if: always()
        run: node scripts/checks/stage-evidence.mjs --gate=${{ matrix.id }} --into=page-metric-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: page-metric-${{ matrix.id }}
          path: page-metric-evidence
          if-no-files-found: warn

  static-analysis-evidence-java:
    needs: static-analysis-plan
    name: Published metric — ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.static-analysis-plan.outputs.java-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        if: matrix.id == 'kotlin-tests' || matrix.id == 'kotlin-coverage'
      - name: Cache Gradle dependencies
        if: matrix.id == 'kotlin-tests' || matrix.id == 'kotlin-coverage'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: npm ci
      - name: Install ktlint
        if: matrix.id == 'kotlin'
        run: |
          curl -sSLo ktlint https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          sudo install ktlint /usr/local/bin/ktlint
      - name: Run metric-producing gate
        run: node scripts/checks/run.mjs --tier=${{ matrix.tier }} --only=${{ matrix.id }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Stage metric evidence with repository-relative paths
        if: always()
        run: node scripts/checks/stage-evidence.mjs --gate=${{ matrix.id }} --into=page-metric-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: page-metric-${{ matrix.id }}
          path: page-metric-evidence
          if-no-files-found: warn

  build:
    needs:
      [
        static-analysis-plan,
        static-analysis-evidence,
        static-analysis-evidence-java,
      ]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Give the file-size ratchet a previous commit to compare against.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: page-metric-*
          path: imported-static-analysis
          merge-multiple: true
      - name: Install static-analysis tools
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz actionlint
          sudo install actionlint /usr/local/bin/actionlint
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          curl -sSLo shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf shellcheck.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          python3 -m pip install ruff==0.15.16 mypy==2.1.0 lizard==1.23.0
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          cargo install cargo-deny --version 0.20.2 --locked
          npx playwright install --with-deps chromium
      # Resolved here rather than read from static-analysis-plan's outputs. This
      # job runs under always(), so it also runs when that job never produced
      # outputs — and an empty defer list silently puts the ~70 minute mutation
      # survey back on the publish path, which is what deferring it prevents.
      - name: Resolve gates deferred off the publish path
        id: defer
        run: node scripts/checks/pages-plan.mjs | grep '^deferred=' >> "$GITHUB_OUTPUT"
      - name: Run checks and capture reports
        run: npm run site:reports -- --tier=all
        env:
          SITE_REPORT_IMPORT_DIR: imported-static-analysis
          SITE_REPORT_IMPORT_GATES: ${{ needs.static-analysis-plan.outputs.imports }}
          SITE_REPORT_DEFER_GATES: ${{ steps.defer.outputs.deferred }}
          # CI measures each gate on a fresh checkout. Restore that isolation
          # here so generated output from an earlier gate cannot greenwash a
          # later one (see scripts/site/isolate-worktree.mjs).
          SITE_REPORT_ISOLATE: "1"
      - name: Build documentation site
        run: npm run site:build
      - name: Verify the generated site, including screenshots
        run: npm run site:verify -- --require-dist --record
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/.vitepress/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: site-results
          path: site-results
          if-no-files-found: warn

  deploy:
    needs: [build, freshness]
    if: always() && needs.build.result == 'success' && needs.freshness.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.retry2.outputs.page_url || steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # Creating a Pages deployment 503s when GitHub's Pages API is down. An
      # immediate second attempt retried into the same outage and left
      # /results/ on the previous commit. Wait between attempts. The action
      # caps `timeout` at 10 minutes regardless of the value we pass.
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 25
      - name: Wait after a transient Pages deploy failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          timeout: 600000
          error_count: 25
      - name: Wait after a second transient Pages deploy failure
        if: steps.retry.outcome == 'failure'
        run: sleep 120
      - id: retry2
        if: steps.retry.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          timeout: 600000
          error_count: 25

  freshness:
    needs: build
    # always() is load-bearing, not decoration. Without a status-check function
    # here GitHub skips this job whenever any transitive dependency failed —
    # including a single metric gate — and deploy, which requires freshness to
    # have succeeded, is skipped with it. That silently blocked publishing on
    # every run where a published metric reported a finding.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to deploy a superseded main build
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const latest = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'main'
            });
            if (latest.data.sha !== context.sha) {
              core.setFailed(`Pages build ${context.sha} is stale; current main is ${latest.data.sha}`);
            }

  verify-deployment:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Verify published analysis provenance
        run: node scripts/site/verify-publication.mjs "https://curtcox.github.io/twistedpear/results/raw/summary.json?sha=${GITHUB_SHA}" "${GITHUB_SHA}"

  record-gate-results:
    # The reverse channel for the work queue. Every gate this run measured is
    # published to /results/, but nothing wrote that back to the repository, so
    # `work:next` kept answering from whatever the last local run had recorded —
    # 29 gates red on the published page, a clean tree in `checks.json`.
    #
    # Importing them here makes the failures top-priority work: a red PR-tier
    # gate in `checks.json` derives a `GATE-*` item of type `broken-gate`, and
    # that type outranks every other class in `scripts/work/lib.mjs`. The item
    # exists only while the gate is red, so the only way to clear it is to fix
    # the check.
    #
    # It waits on `deploy` so the write to `main` stays off the publish path,
    # but runs whatever `build` and `deploy` concluded: a build that died after
    # the reports — the site build failing, say — is exactly when the queue most
    # needs to hear what the gates said. Pushing with GITHUB_TOKEN does not
    # start another workflow run, so this cannot loop.
    needs: [build, deploy]
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - id: fetch
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-results
          path: site-results
      - name: Note that the build measured nothing
        if: steps.fetch.outcome != 'success'
        run: |
          echo "This run recorded no site-results artifact; it did not get far"
          echo "enough to measure any gate. Nothing to record."
      - name: Record what CI measured in checks.json
        if: steps.fetch.outcome == 'success'
        run: |
          set -euo pipefail
          node scripts/checks/import.mjs \
            --from=site-results/summary.json --write | tee "$RUNNER_TEMP/import.log"
          {
            echo "### Gate results recorded in checks.json"
            echo
            echo '```'
            cat "$RUNNER_TEMP/import.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the record when it changed
        if: steps.fetch.outcome == 'success'
        env:
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet -- checks.json; then
            echo "checks.json already says what this run measured."
            exit 0
          fi
          # A record of a commit that is no longer main is not worth a write:
          # the run for the newer commit records its own results, and pushing
          # here would only lose a race with it.
          git fetch --depth=1 origin main
          current="$(git rev-parse FETCH_HEAD)"
          if [ "$current" != "$COMMIT" ]; then
            echo "main is now ${current}, not ${COMMIT}; leaving the record to that run."
            exit 0
          fi
          # writeChecks emits JSON.stringify(..., 2), so a red gate is always
          # its own line; counting them needs no second node invocation.
          red="$(grep -c '"ok": false' checks.json || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checks.json
          git commit --message "Record ${red} red gate(s) measured at ${COMMIT:0:12}" \
            --message "Imported from the published run summary by the Pages workflow. Red PR-tier gates derive GATE-* broken-gate items, so work:next now returns them ahead of every other kind of work. ${RUN_URL}"
          git push origin HEAD:main

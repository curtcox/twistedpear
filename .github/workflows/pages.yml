name: Pages

# This workflow's status answers one question: did the site publish? Reported
# gate results are evaluated by the Site checks workflow (site-checks.yml),
# which runs after this one, so a gate finding can never make a successful
# publish look like a failed one.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let in-flight builds finish. The freshness job already refuses to publish a
  # superseded commit, so cancelling here only threw away work that was about to
  # deploy.
  cancel-in-progress: false

jobs:
  static-analysis-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      imports: ${{ steps.plan.outputs.imports }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - id: plan
        run: node scripts/checks/pages-plan.mjs >> "$GITHUB_OUTPUT"

  static-analysis-evidence:
    needs: static-analysis-plan
    name: Published metric — ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.static-analysis-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install SwiftLint
        if: matrix.id == 'swift'
        run: |
          brew install swiftlint
          test "$(swiftlint version)" = "0.65.0"
      - name: Install lizard
        if: matrix.id == 'hotspots'
        run: python3 -m pip install lizard==1.23.0
      - uses: actions/setup-java@v5
        if: matrix.id == 'kotlin-tests'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        if: matrix.id == 'kotlin-tests'
      - name: Run metric-producing gate
        run: node scripts/checks/run.mjs --tier=${{ matrix.tier }} --only=${{ matrix.id }}
      - name: Stage metric evidence with repository-relative paths
        if: always()
        run: node scripts/checks/stage-evidence.mjs --gate=${{ matrix.id }} --into=page-metric-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: page-metric-${{ matrix.id }}
          path: page-metric-evidence
          if-no-files-found: warn

  build:
    needs: [static-analysis-plan, static-analysis-evidence]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          # Give the file-size ratchet a previous commit to compare against.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: page-metric-*
          path: imported-static-analysis
          merge-multiple: true
      - name: Install static-analysis tools
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz actionlint
          sudo install actionlint /usr/local/bin/actionlint
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          curl -sSLo shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf shellcheck.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          python3 -m pip install ruff==0.15.16 mypy==2.1.0 lizard==1.23.0
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          cargo install cargo-deny --version 0.20.2 --locked
          curl -sSLo ktlint https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          sudo install ktlint /usr/local/bin/ktlint
          npx playwright install --with-deps chromium
      - name: Verify TLA+ tools
        run: echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  formal/tla2tools.jar" | sha1sum --check
      # Resolved here rather than read from static-analysis-plan's outputs. This
      # job runs under always(), so it also runs when that job never produced
      # outputs — and an empty defer list silently puts the ~70 minute mutation
      # survey back on the publish path, which is what deferring it prevents.
      - name: Resolve gates deferred off the publish path
        id: defer
        run: node scripts/checks/pages-plan.mjs | grep '^deferred=' >> "$GITHUB_OUTPUT"
      - name: Run checks and capture reports
        run: npm run site:reports -- --tier=all
        env:
          SITE_REPORT_IMPORT_DIR: imported-static-analysis
          SITE_REPORT_IMPORT_GATES: ${{ needs.static-analysis-plan.outputs.imports }}
          SITE_REPORT_DEFER_GATES: ${{ steps.defer.outputs.deferred }}
          # CI measures each gate on a fresh checkout. Restore that isolation
          # here so generated output from an earlier gate cannot greenwash a
          # later one (see scripts/site/isolate-worktree.mjs).
          SITE_REPORT_ISOLATE: "1"
      - name: Report pending screenshots for the guide, authoring guide, and cookbook
        run: npm run site:section-images:report
      - name: Build documentation site
        run: npm run site:build
      - name: Verify the reader-facing guide sections were published
        run: node scripts/site/verify-sections.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-results
          path: site-results
          if-no-files-found: warn

  deploy:
    needs: [build, freshness]
    if: always() && needs.build.result == 'success' && needs.freshness.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # The default 10-minute timeout turns a GitHub Pages deployment-lag
      # incident into a skipped publish. Wait longer, tolerate more transient
      # status-report errors, and try a second time before giving up.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 1800000
          error_count: 25
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
          error_count: 25

  freshness:
    needs: build
    # always() is load-bearing, not decoration. Without a status-check function
    # here GitHub skips this job whenever any transitive dependency failed —
    # including a single metric gate — and deploy, which requires freshness to
    # have succeeded, is skipped with it. That silently blocked publishing on
    # every run where a published metric reported a finding.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to deploy a superseded main build
        uses: actions/github-script@v9
        with:
          script: |
            const latest = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'main'
            });
            if (latest.data.sha !== context.sha) {
              core.setFailed(`Pages build ${context.sha} is stale; current main is ${latest.data.sha}`);
            }

  verify-deployment:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify published analysis provenance
        run: node scripts/site/verify-publication.mjs "https://curtcox.github.io/twistedpear/results/raw/summary.json?sha=${GITHUB_SHA}" "${GITHUB_SHA}"

name: CI telemetry

# Records what every run cost — per job, per step, and per resource — into the
# `ci-metrics` branch, which the Pages build reads to publish the CI cost
# report. This is measurement, not a gate: it never fails a run and it never
# blocks a deploy.
#
# It runs on `workflow_run: completed` rather than inside the workflows it
# measures, because a job cannot report its own finish time, and because a
# separate run keeps the collection off the critical path of everything else.

on:
  workflow_run:
    workflows:
      - CI
      - Pages
      - Nightly
      - CodeQL nightly
      - Mobile Emulator Lab
      - Symbolic Formal Verification
      - Site checks
      - Survey
    types: [completed]
  workflow_dispatch:
    inputs:
      backfill-limit:
        description: Runs per workflow to import from Actions history.
        required: false
        default: "40"
      backfill-branch:
        description: Branch whose runs to import.
        required: false
        default: main

permissions:
  contents: write
  actions: read

concurrency:
  # One writer at a time: every run of this workflow pushes to the same branch,
  # and a lost race would silently drop a run from the history.
  group: ci-telemetry-store
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Check out the metrics store
        id: store
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/store-checkout.mjs --into=ci-metrics

      - name: Download the telemetry this run's jobs uploaded
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: ci-telemetry-*
          path: downloaded-telemetry
          merge-multiple: true

      - name: Record the finished run
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/collect-run.mjs \
            --run-id=${{ github.event.workflow_run.id }} \
            --attempt=${{ github.event.workflow_run.run_attempt }} \
            --telemetry=downloaded-telemetry \
            --store=ci-metrics

      - name: Import runs that predate the collector
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/backfill.mjs \
            --store=ci-metrics \
            --limit=${{ inputs.backfill-limit }} \
            --branch=${{ inputs.backfill-branch }}

      - name: Publish the store
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TELEMETRY_SUBJECT: >-
            ${{ github.event.workflow_run.name }} run
            ${{ github.event.workflow_run.run_number }}
            at ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci/store-push.mjs --from=ci-metrics

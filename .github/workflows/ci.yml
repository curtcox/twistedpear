name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- packages/reticulum-ts/test/golden-vectors.test.ts packages/reticulum-ts/test/interfaces.test.ts packages/reticulum-ts/test/web-runtime.test.ts packages/lxmf-ts/test/golden-vectors.test.ts

  bare-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:bare-smoke

  bare-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:bare-runtime

  interfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- packages/reticulum-interfaces/test
      - run: npm run test:bonjour-interop
      - run: npm run test:integration-soak

  bare-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build leaf-echo link-echo lxmf-echo
      - run: npm run test:bare-interop
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  auto-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build auto-interop
      - run: npm run test:auto-interop
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  i2p-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p conformance/scenarios/state
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build i2pd i2p-interop
      - run: npm run test:i2p-interop
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  bare-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build leaf-echo
      - run: npm run test:bare-device
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  bare-hyperswarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:bare-hyperswarm

  dist-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- packages/app-registry/test/package.test.ts
      - run: npm run test:dist-interop

  bare-hyperdrive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:bare-hyperdrive

  seeder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:seeder

  updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:updates

  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:budgets

  harness-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:harness-install

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:cli

  miniapp-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:hostile-apps
      - run: npm run test:miniapp-benchmark
      - run: npm run test:sdk-interop
      - run: npm run test:dev-loop
      - run: npm run test:examples

  devstudio-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:devstudio-loop

  devstudio-loop-macos:
    runs-on: macos-14
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:devstudio-loop

  miniapp-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:miniapp-soak

  demo-phase4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run demo:phase4

  dist-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:dist-soak

  demo-phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run demo:phase3

  bare-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:bare-benchmark-compare
      - run: npm run test:bare-benchmark-bare-compare

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: INTEROP=1 LINK_BENCHMARK_RECORD=1 npm run test:link-benchmark
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: link-benchmark-measured
          path: conformance/link-benchmark/measured.json
      - run: npm run test:interop
      - run: INTEROP=1 npm run test:web-interop
      - run: npx playwright install chromium --with-deps
      - run: INTEROP=1 npm run test:web-interop-browser

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:web-runtime
      - run: npx playwright install chromium --with-deps
      - run: npm run test:web-sandbox
      - run: npm run test:web-widget-renderer
      - run: npm run test:web-storage
      - run: npm run test:web-miniapp
      - run: npm run test:web-examples
      - run: npm run test:web-distribution
      - run: npm run test:web-devstudio
      - run: npm run test:web-soak
      - run: npm run test:web-pwa

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:fuzz
        env:
          FUZZ_ITERATIONS: "512"

  serialport-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:serialport-load
        env:
          SERIAL_LOAD_ITERATIONS: "128"

  electron-pack-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            desktop:
              - 'apps/host-desktop/**'
              - 'packages/host-core/**'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.desktop == 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.desktop == 'true'
      - run: npm run build
        if: steps.changes.outputs.desktop == 'true'
      - run: npm run dist --workspace=host-desktop
        if: steps.changes.outputs.desktop == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.desktop == 'true'
        with:
          name: host-desktop-macos
          path: apps/host-desktop/release
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run docs:reticulum-ts

  electron-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack --workspace=host-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: host-desktop-linux
          path: apps/host-desktop/release
          if-no-files-found: error

  ios-sim:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            ios:
              - 'apps/harness-mobile/**'
              - 'apps/examples/**'
              - 'packages/reticulum-interfaces/**'
              - 'packages/reticulum-ts/**'
              - 'packages/app-registry/**'
              - 'packages/bridge-hyper/**'
              - 'packages/miniapp-runtime/**'
              - 'packages/miniapp-sdk/**'
              - 'packages/cli/**'
              - 'conformance/ios-sim/**'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.ios == 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.ios == 'true'
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build leaf-echo
        if: steps.changes.outputs.ios == 'true'
      - run: npm run test:ios-sim:required
        if: steps.changes.outputs.ios == 'true'
        env:
          IOS_SIM_TCP_REQUIRED: "1"
          IOS_LIFECYCLE_CYCLES: "100"
      - if: always() && steps.changes.outputs.ios == 'true'
        run: docker compose -f conformance/docker/docker-compose.yml down

  demo-phase5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run demo:phase5

  desktop-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:widget-parity
      - run: npm run demo:phase6

  desktop-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build leaf-echo lxmf-echo propagation-lxmd
      - run: INTEROP=1 npm run test:transport-role
      - run: INTEROP=1 npm run test:rnsd-mode
      - run: INTEROP=1 npm run test:propagation-interop
      - run: INTEROP=1 npm run test:desktop-lifecycle
        env:
          DESKTOP_LIFECYCLE_CYCLES: "100"
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  desktop-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            desktop:
              - 'apps/host-desktop/**'
              - 'packages/host-core/**'
              - 'conformance/desktop/**'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.desktop == 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.desktop == 'true'
      - run: npm run test:desktop
        if: steps.changes.outputs.desktop == 'true'
      - run: npm run test:widget-parity
        if: steps.changes.outputs.desktop == 'true'
      - run: npm run test:serialport-load
        if: steps.changes.outputs.desktop == 'true'

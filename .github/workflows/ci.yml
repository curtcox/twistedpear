name: CI

permissions:
  contents: read
  pull-requests: write
  security-events: write

on:
  pull_request:
  push:
    branches:
      - main
      # Release branches carry G1 evidence, so the keep-green invariant has to
      # hold on the branch being shipped, not only on main.
      - "release/**"

jobs:
  gate-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - id: matrix
        run: echo "matrix=$(npm run --silent checks:matrix)" >> "$GITHUB_OUTPUT"

  static-analysis:
    needs: gate-plan
    name: Gate — ${{ matrix.title }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: matrix.id == 'python'
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.id == 'kotlin' || matrix.id == 'kotlin-tests' || matrix.id == 'kotlin-coverage' || matrix.id == 'formal'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        if: matrix.id == 'kotlin-tests' || matrix.id == 'kotlin-coverage'
      - name: Cache Gradle dependencies
        if: matrix.id == 'kotlin-tests' || matrix.id == 'kotlin-coverage'
        # The Android build resolves org.gradle.toolchains.foojay-resolver-
        # convention from the plugin portal on every cold run, because it is
        # declared by a third-party included build under node_modules that we
        # neither own nor can pin. A portal hiccup is what made this gate a coin
        # flip. Restoring Gradle's caches means the usual run does not reach the
        # network for it at all; `restore-keys` deliberately accepts a cache
        # from a different lockfile, since any warm cache already holds the
        # plugin marker this is protecting.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: npm ci
      - name: Build workspace packages required by the gate
        # Keep in sync with prebuildPrGates in scripts/checks/registry.mjs.
        if: matrix.id == 'unit-tests' || matrix.id == 'coverage' || matrix.id == 'structure' || matrix.id == 'properties' || matrix.id == 'harness-mobile-typecheck' || matrix.id == 'census'
        run: npm run build
      - name: Install actionlint
        if: matrix.id == 'actionlint'
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz actionlint
          sudo install actionlint /usr/local/bin/actionlint
      - name: Install gitleaks
        if: matrix.id == 'secrets'
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Install ShellCheck
        if: matrix.id == 'shell'
        run: |
          curl -sSLo shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf shellcheck.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: Install Python linters
        if: matrix.id == 'python'
        run: python -m pip install ruff==0.15.16 mypy==2.1.0
      - name: Install lizard
        if: matrix.id == 'complexity-multilang'
        # Pinned like every other analyzer here. Lizard's parsers are
        # hand-written, so a release that counts one more branch shifts CCN
        # across the repository and turns the gate red for reasons that are
        # nowhere in the diff that tripped it.
        run: python -m pip install lizard==1.23.0
      - name: Install Rust analysis tools
        if: matrix.id == 'rust'
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Install Rust toolchain
        # Same pin as the analyzer gate above, without the lint components:
        # tests must run under the compiler the lint gate checks against, or
        # the two gates are describing different code.
        if: matrix.id == 'rust-tests'
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install Rust coverage tools
        # llvm-tools-preview is not optional: cargo-llvm-cov shells out to
        # llvm-profdata and llvm-cov from the toolchain's own component, and
        # without it fails at run time rather than at install.
        if: matrix.id == 'rust-coverage'
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.6.21 --locked
      - name: Install ktlint
        if: matrix.id == 'kotlin'
        run: |
          curl -sSLo ktlint https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          sudo install ktlint /usr/local/bin/ktlint
      - name: Install SwiftLint
        if: matrix.id == 'swift'
        run: |
          brew install swiftlint
          test "$(swiftlint version)" = "0.65.0"
      - name: Install Chromium
        if: matrix.id == 'web-examples' || matrix.id == 'accessibility'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on macOS
        if: matrix.id == 'visual-regression'
        run: npx playwright install chromium
      - name: Install Firefox and WebKit
        if: matrix.id == 'web-cross-browser'
        run: npx playwright install --with-deps firefox webkit
      - name: Run ${{ matrix.title }}
        run: node scripts/checks/run.mjs --tier=pr --only=${{ matrix.id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: gate-${{ matrix.id }}
          path: |
            artifacts/checks/${{ matrix.id }}.json
            artifacts/logs/${{ matrix.id }}.log
            coverage/coverage-summary.json
            coverage-ratchet.json
            structure.json
            complexity.json
            lint.json
            typed-lint.json
            licenses.json
            gitleaks.json
            census.json
            artifacts/formal/formal.json
            artifacts/languages/rust-tests.json
            artifacts/languages/swift-tests.json
            artifacts/languages/kotlin-tests.json
            artifacts/languages/swift-coverage.json
            artifacts/languages/kotlin-coverage.json
            language-ratchets/swift-coverage.json
            language-ratchets/kotlin-coverage.json
            artifacts/web-examples/web-examples.json
            artifacts/web-examples/web-examples-firefox.json
            artifacts/web-examples/web-examples-webkit.json
            artifacts/visual-regression.json
            artifacts/accessibility/accessibility.json
            artifacts/differential-fuzz/differential-fuzz.json
            reports/jscpd.json
            reports/cognitive-complexity.json
            reports/type-coverage.json
            jscpd-ratchet.json
            cognitive-complexity-ratchet.json
            type-coverage-ratchet.json
            conformance/sim-campaign/artifacts/fixed-replay.json
          if-no-files-found: warn

  pr-dashboard:
    needs: static-analysis
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: gate-*
          path: gate-artifacts
      - run: node scripts/checks/aggregate.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-analysis-summary
          path: static-analysis-summary.json
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('static-analysis-summary.md', 'utf8');
            const marker = '<!-- twistedpear-static-analysis -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const prior = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (prior) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: prior.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });

  codeql:
    name: CodeQL — ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            filter: javascript
            runner: ubuntu-latest
          - language: python
            filter: python
            runner: ubuntu-latest
          - language: actions
            filter: actions
            runner: ubuntu-latest
          - language: java-kotlin
            filter: kotlin
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            filter: swift
            runner: macos-15
            build-mode: autobuild
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            javascript:
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.ts'
              - '**/*.tsx'
            python:
              - '**/*.py'
            actions:
              - '.github/workflows/**'
              - '.github/actions/**'
            kotlin:
              - '**/*.kt'
              - '**/*.kts'
            swift:
              - '**/*.swift'
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: steps.changes.outputs[matrix.filter] == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: steps.changes.outputs[matrix.filter] == 'true'
        with:
          category: /language:${{ matrix.language }}

  freenet-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Freenet unit suites (bridge, simulated adapter, announce+LXMF)
        run: |
          npm test -- \
            packages/bridge-freenet/test \
            packages/effects/test/freenet-sim.test.ts \
            packages/reticulum-interfaces/test/freenet-announce-lxmf.test.ts \
            apps/harness-mobile/test/freenet-remote-grant.test.ts \
            apps/harness-mobile/test/freenet-remote-session.test.ts
      - name: Verify Bare SDK compatibility
        run: npm run test:freenet-spike
      - name: Install pinned Rust contract toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
      - name: Verify ordered-log convergence
        run: npm run test:freenet-ordered-log
      - name: Rebuild committed Freenet contracts
        run: npm run build:freenet-contract
      - name: Verify reproducible contract artifacts
        run: |
          git diff --exit-code -- \
            packages/bridge-freenet/contract/locator/locator-contract.wasm \
            packages/bridge-freenet/contract/packet-log/packet-log-contract.wasm \
            packages/bridge-freenet/contract/propagation-set/propagation-set-contract.wasm

  freenet-real-node:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Download pinned Freenet node
        run: |
          mkdir -p .tmp/freenet-ci
          curl -L -o .tmp/freenet-ci/freenet.tar.gz \
            https://github.com/freenet/freenet-core/releases/download/v0.2.112/freenet-x86_64-unknown-linux-musl.tar.gz
          echo "b5b6bdf975c1563a98507e94c8edc1091278306e16f25ef216aacea1570a5571  .tmp/freenet-ci/freenet.tar.gz" | sha256sum --check
          tar -xzf .tmp/freenet-ci/freenet.tar.gz -C .tmp/freenet-ci
          chmod +x .tmp/freenet-ci/freenet
      - name: Verify Freenet Reticulum interface
        run: npm run test:freenet-interface
        env:
          FREENET_BINARY: ${{ github.workspace }}/.tmp/freenet-ci/freenet
      - name: Verify Freenet LXMF propagation mirror
        run: npm run test:freenet-propagation
        env:
          FREENET_BINARY: ${{ github.workspace }}/.tmp/freenet-ci/freenet
      - name: Verify FreenetSupervisor with user-supplied binary
        run: npm run test:freenet-supervisor
        env:
          FREENET_BINARY: ${{ github.workspace }}/.tmp/freenet-ci/freenet
          FREENET_SUPERVISOR_LABEL: ci-linux-musl
      - name: Verify distinct-node F2/F3 smoke
        run: npm run test:freenet-distinct-nodes -- --smoke
        env:
          FREENET_BINARY: ${{ github.workspace }}/.tmp/freenet-ci/freenet
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: freenet-real-node-proofs
          path: |
            .tmp/f2-interface-proof-local-isolated.json
            .tmp/f3-propagation-proof-local-isolated.json
            .tmp/freenet-supervisor-proof-ci-linux-musl.json
            .tmp/freenet-distinct-nodes-smoke.json
          if-no-files-found: error

  sansio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@twistedpear/effects --workspace=@twistedpear/protocol
      - run: npm run sansio
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sansio-artifacts
          path: |
            violations.json
            sansio-canary.json
            dependency-graph.json
          if-no-files-found: warn

  local-multipeer:
    # Headless tier only: two `tp node` peers over the local TCP hub. The GUI
    # peers (desktop, iOS, Android) run in emulator.yml on manual dispatch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:local-multipeer:smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: local-multipeer-proof
          path: .tmp/local-peers/multipeer-proof.json
          if-no-files-found: warn

  simulation-replay:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:sim-fixed-replay -- conformance/sim-campaign/artifacts/fixed-replay.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sim-fixed-replay-${{ matrix.os }}
          path: conformance/sim-campaign/artifacts/fixed-replay.json
          if-no-files-found: error

  simulation-replay-compare:
    needs: simulation-replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sim-fixed-replay-ubuntu-latest
          path: replay/ubuntu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sim-fixed-replay-macos-15
          path: replay/macos
      - name: Compare Linux and macOS replay bytes
        run: cmp replay/ubuntu/fixed-replay.json replay/macos/fixed-replay.json

  # The formal checks moved to the `formal` registry gate, which runs the same
  # jar-checksum verification, conformance check, symbolic inventory and three
  # TLC models — and publishes the result to /results/, which this job never did.

  core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- packages/reticulum-ts/test/golden-vectors.test.ts packages/reticulum-ts/test/interfaces.test.ts packages/reticulum-ts/test/web-runtime.test.ts packages/lxmf-ts/test/golden-vectors.test.ts

  bare-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:bare-smoke

  bare-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:bare-runtime

  interfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- packages/reticulum-interfaces/test
      - run: npm run test:bonjour-interop
      - run: npm run test:integration-soak

  bare-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build leaf-echo link-echo lxmf-echo
      - run: npm run test:bare-interop
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  auto-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # veth between two --network none containers (distinct bindable fe80 addrs).
      - run: npm run test:auto-interop:compose

  i2p-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p conformance/scenarios/state
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build --wait --wait-timeout 300 i2pd i2p-interop
      - run: npm run test:i2p-interop
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml logs i2pd i2p-interop
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  ntfy-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Disposable self-hosted server on a loopback port; never the public service.
      - run: NTFY_SERVICE_REQUIRED=1 npm run test:ntfy-service

  bare-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build leaf-echo
      - run: npm run test:bare-device
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  bare-hyperswarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:bare-hyperswarm

  dist-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- packages/app-registry/test/package.test.ts
      - run: npm run test:dist-interop

  bare-hyperdrive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:bare-hyperdrive

  seeder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:seeder

  updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:updates

  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:budgets

  harness-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:harness-install

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:cli

  miniapp-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:hostile-apps
      - run: npm run test:miniapp-benchmark
      - run: npm run test:sdk-interop
      - run: npm run test:dev-loop
      - run: npm run test:examples
      - run: npm run test:cookbook
      - run: npm run test:handbook
      - run: npm run test:handbook-mobile

  devstudio-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:devstudio-loop

  devstudio-loop-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: github.event_name == 'pull_request'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: github.event_name == 'pull_request'
      - run: npm run test:devstudio-loop
        if: github.event_name == 'pull_request'

  miniapp-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:miniapp-soak

  demo-phase4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run demo:phase4

  dist-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:dist-soak
        env:
          # Allow Hyperdrive replication retries without starving the cycle budget.
          SOAK_DURATION_MS: "60000"

  demo-phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run demo:phase3

  # The crypto benchmarks moved to the nightly `benchmark` registry gate, which
  # runs the same two suites against the same references and publishes the
  # per-benchmark numbers. Throughput measured on a shared PR runner alongside
  # forty other jobs is noise; nightly is where the numbers mean something.

  python-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Provision pinned Python interop peers
        run: docker compose -f conformance/docker/docker-compose.yml build leaf-echo lxmf-echo link-echo udp-echo resource-echo
      - name: Record Python interop dependency versions
        run: docker compose -f conformance/docker/docker-compose.yml run --rm --no-deps leaf-echo python -c "import importlib.metadata as m; print('rns=' + m.version('rns')); print('lxmf=' + m.version('lxmf'))" > python-interop-versions.txt
      - run: INTEROP=1 LINK_BENCHMARK_RECORD=1 npm run test:link-benchmark
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: link-benchmark-measured
          path: conformance/link-benchmark/measured.json
      - run: npm run test:interop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: python-interop-versions
          path: python-interop-versions.txt
          if-no-files-found: error

  web-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: INTEROP=1 npm run test:web-interop
      - run: npx playwright install chromium --with-deps
      - run: |
          INTEROP=1 npm run test:web-interop-browser || INTEROP=1 npm run test:web-interop-browser
        # Browser return-path races are intermittent; one automatic retry covers
        # the common "LXMF/packet echo timeout" flake without masking hard bugs.

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:web-runtime
      - run: npx playwright install chromium --with-deps
      - run: npm run test:web-sandbox
      - run: npm run test:web-widget-renderer
      - run: npm run test:web-storage
      - run: npm run test:web-miniapp
      # test:web-examples moved to the `web-examples` registry gate, which is
      # where its result now reaches /results/. Running it here too would only
      # duplicate an 11s job and give it a second place to be red unnoticed.
      - run: npm run test:web-cookbook
      - run: npm run test:web-distribution
      - run: npm run test:web-devstudio
      - run: npm run test:web-handbook
      - run: npm run test:web-soak
      - run: npm run test:web-pwa
      - run: npm run test:web-hyperdrive
      - run: npm run test:web-hyperdrive-browser
      - run: npm run test:web-rnode

  # The fuzz suite moved to the `fuzz` registry gate. The 512-iteration count
  # that used to live in this job's `env:` now lives in the `test:fuzz` script,
  # so a local run and a CI run fuzz equally hard.

  serialport-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:serialport-load
        env:
          SERIAL_LOAD_ITERATIONS: "128"

  electron-pack-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'pull_request'
        id: changes
        with:
          filters: |
            desktop:
              - 'apps/host-desktop/**'
              - 'packages/host-core/**'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.changes.outputs.desktop == 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.desktop == 'true'
      - run: npm run build
        if: steps.changes.outputs.desktop == 'true'
      - run: npm run dist --workspace=host-desktop
        if: steps.changes.outputs.desktop == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.changes.outputs.desktop == 'true'
        with:
          name: host-desktop-macos
          path: apps/host-desktop/release
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run docs:reticulum-ts

  electron-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack --workspace=host-desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: host-desktop-linux
          path: apps/host-desktop/release
          if-no-files-found: error

  ios-sim:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            ios:
              - 'apps/harness-mobile/**'
              - 'apps/handbook/**'
              - 'apps/examples/**'
              - 'packages/reticulum-interfaces/**'
              - 'packages/reticulum-ts/**'
              - 'packages/app-registry/**'
              - 'packages/bridge-hyper/**'
              - 'packages/miniapp-runtime/**'
              - 'packages/miniapp-sdk/**'
              - 'packages/cli/**'
              - 'conformance/ios-sim/**'
              - 'conformance/handbook/**'
              - '.maestro/**'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.changes.outputs.ios == 'true'
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.changes.outputs.ios == 'true'
        with:
          python-version: "3.12"
      - run: npm ci
        if: steps.changes.outputs.ios == 'true'
      - run: python3 -m pip install "rns==0.9.5"
        if: steps.changes.outputs.ios == 'true'
      - run: bash conformance/ios-sim/ci-required.sh
        if: steps.changes.outputs.ios == 'true'
        env:
          IOS_SIM_TCP_REQUIRED: "1"
          IOS_LIFECYCLE_CYCLES: "100"

  demo-phase5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run demo:phase5

  desktop-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:widget-parity
      - run: npm run demo:phase6

  desktop-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build leaf-echo lxmf-echo propagation-lxmd
      - run: INTEROP=1 npm run test:transport-role
      - run: INTEROP=1 npm run test:rnsd-mode
      - run: INTEROP=1 npm run test:propagation-interop
      - run: INTEROP=1 npm run test:desktop-lifecycle
        env:
          DESKTOP_LIFECYCLE_CYCLES: "100"
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'pull_request'
        id: changes
        with:
          filters: |
            desktop:
              - 'apps/host-desktop/**'
              - 'packages/host-core/**'
              - 'conformance/desktop/**'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.changes.outputs.desktop == 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.desktop == 'true'
      - run: npm run test:desktop
        if: steps.changes.outputs.desktop == 'true'
      - run: npm run test:widget-parity
        if: steps.changes.outputs.desktop == 'true'
      - run: npm run test:serialport-load
        if: steps.changes.outputs.desktop == 'true'

  ci-green:
    if: always()
    needs:
      - gate-plan
      - static-analysis
      - pr-dashboard
      - codeql
      - freenet-offline
      - freenet-real-node
      - sansio
      - local-multipeer
      - simulation-replay
      - simulation-replay-compare
      - core-smoke
      - bare-smoke
      - bare-runtime
      - interfaces
      - bare-interop
      - auto-interop
      - i2p-interop
      - ntfy-service
      - bare-device
      - bare-hyperswarm
      - dist-interop
      - bare-hyperdrive
      - seeder
      - updates
      - budgets
      - harness-install
      - cli
      - miniapp-conformance
      - devstudio-loop
      - devstudio-loop-macos
      - miniapp-soak
      - demo-phase4
      - dist-soak
      - demo-phase3
      - python-interop
      - web-interop
      - web
      - serialport-load
      - electron-pack-macos
      - docs
      - electron-pack
      - ios-sim
      - demo-phase5
      - desktop-smoke
      - desktop-interop
      - desktop-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require every CI dependency to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/checks/ci-green.mjs

name: Mobile Emulator Lab

on:
  workflow_dispatch:

# Android: headless proxies + KVM Maestro E1–E5. iOS: macOS Handbook Maestro UI smoke.

jobs:
  headless-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build leaf-echo
      - run: npm run test:harness-install
      - run: npm run test:lan-mirror
      - run: npm run test:bare-device
      - run: npm run test:updates
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: npm run test:android-native

  emulator-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: chmod +x conformance/android-emulator/ci.sh && conformance/android-emulator/ci.sh

  ios-handbook-ui:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: chmod +x conformance/ios-sim/ci-handbook.sh && conformance/ios-sim/ci-handbook.sh

  local-multipeer-ios:
    # Full GUI matrix on a macOS runner: TCP hub, a second headless node, and
    # the iOS simulator harness. See docs/local-multipeer.md.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - run: npm run test:local-multipeer -- --peers=hub,node2,ios
        env:
          LOCAL_MULTIPEER_REQUIRED: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-multipeer-ios-proof
          path: .tmp/local-peers/multipeer-proof.json
          if-no-files-found: warn

  cross-device-dev:
    # Dedicated Mac lab: Xcode Simulator + API 34 emulator + Electron + Chromium.
    # The runner image keeps both native harness builds installed and warm.
    runs-on: [self-hosted, macOS, twistedpear-emulator-lab]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:cross-device-dev -- --build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-device-dev-proof
          path: .tmp/cross-device-dev
          if-no-files-found: error

  cross-device-dev-matrix:
    # The full device matrix, on the same Mac lab. Moved here from nightly.yml:
    # on a schedule it waited out the 24h queue limit every night, because no
    # self-hosted runner carries these labels yet.
    runs-on: [self-hosted, macOS, twistedpear-emulator-lab]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:cross-device-dev:matrix -- --build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-device-dev-matrix-proof
          path: .tmp/cross-device-dev
          if-no-files-found: error

name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      soak_duration_ms:
        description: "SOAK_DURATION_MS for distribution soak"
        required: false
        default: "300000"
      desktop_soak_cycles:
        description: "DESKTOP_SOAK_CYCLES (864 for 72 h at 5 min/cycle)"
        required: false
        default: "5"
      link_soak_duration_ms:
        description: "LINK_SOAK_DURATION_MS (3600000 = 1 h plan exit)"
        required: false
        default: "300000"
      transport_soak_duration_ms:
        description: "TRANSPORT_SOAK_DURATION_MS (259200000 = 72 h plan exit)"
        required: false
        default: "300000"

jobs:
  static-analysis-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - id: matrix
        run: echo "matrix=$(npm run --silent checks:matrix -- --tier=nightly)" >> "$GITHUB_OUTPUT"

  static-analysis-nightly:
    needs: static-analysis-plan
    name: Nightly gate — ${{ matrix.title }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.static-analysis-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build workspace packages required by the gate
        if: matrix.id == 'mutation'
        run: npm run build
      - name: Install lizard
        if: matrix.id == 'hotspots'
        # Pinned to match the PR-tier complexity-multilang gate, so the two
        # never disagree about a function's CCN. The `fetch-depth: 0` above is
        # what makes the churn half of this gate meaningful — a shallow clone
        # reports one commit per file and the ranking collapses.
        run: python -m pip install lizard==1.23.0
      - run: node scripts/checks/run.mjs --tier=nightly --only=${{ matrix.id }}
        env:
          PROPERTY_RUNS: "2000"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-${{ matrix.id }}
          path: |
            artifacts/checks/${{ matrix.id }}.json
            audit.json
            sbom.cdx.json
            reports/mutation/mutation.json
          if-no-files-found: warn

  property-campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/checks/run.mjs --tier=pr --only=properties
        env:
          PROPERTY_RUNS: "2000"

  # cross-device-dev-matrix lives in emulator.yml, not here. It needs the
  # self-hosted Mac lab, and no such runner is registered; on a schedule the job
  # just waits out the 24h queue limit and fails, holding a slot the whole time.
  # emulator.yml is workflow_dispatch, so it only waits when someone asks for it.

  simulation-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:sim-campaign
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulation-campaign
          path: conformance/sim-campaign/artifacts
          if-no-files-found: error

  # The soak jobs below take their duration from a workflow_dispatch input whose
  # plan-level targets run to 72 h, and their timeouts were written to match
  # (1500 and 4500 minutes). GitHub stops a job on a hosted runner at 6 h no
  # matter what timeout-minutes says, so those values only ever described an
  # intent — 350 is the largest that can actually be honoured. On the nightly
  # schedule these run the 300000 ms default and finish in under ten minutes; a
  # soak that genuinely needs longer than 6 h needs a self-hosted runner.
  dist-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:dist-soak
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  phase3-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run demo:phase3

  phase4-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run demo:phase4

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:examples

  miniapp-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:miniapp-soak
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  web-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:web-soak
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  harness-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:harness-install

  lan-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:lan-mirror

  integration-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration-soak
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  mixed-network-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:mixed-network-soak
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  ios-sim:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python3 -m pip install "rns==0.9.5"
      - run: bash conformance/ios-sim/ci-required.sh
        env:
          IOS_SIM_TCP_REQUIRED: "1"
          IOS_LIFECYCLE_CYCLES: "100"

  upstream-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f conformance/docker/docker-compose.yml build --build-arg UNPINNED=1 leaf-echo lxmf-echo link-echo udp-echo resource-echo propagation-lxmd
      - run: INTEROP=1 npm run test:interop
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  ios-soak:
    runs-on: macos-15
    # GitHub's macOS runners have no Docker, so the leaf-echo peer comes from
    # the native Python RNS path that ios-sim already uses, not docker compose.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python3 -m pip install "rns==0.9.5"
      - run: bash conformance/scenarios/with-leaf-echo-peer.sh npm run test:ios-soak:required
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}
          IOS_LIFECYCLE_CYCLES: "100"

  desktop-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:desktop-soak
        env:
          DESKTOP_SOAK_CYCLES: ${{ github.event.inputs.desktop_soak_cycles || '5' }}
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:widget-parity

  resource-interop-100mb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build resource-echo
      - run: INTEROP=1 npm run test:interop -- --testNamePattern="Resource transfer"
        env:
          RESOURCE_INTEROP_SIZES: "104857600"
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  link-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: INTEROP=1 npm run test:link-soak
        env:
          LINK_SOAK_DURATION_MS: ${{ github.event.inputs.link_soak_duration_ms || '300000' }}

  transport-node-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: INTEROP=1 npm run test:transport-node-soak
        env:
          TRANSPORT_SOAK_DURATION_MS: ${{ github.event.inputs.transport_soak_duration_ms || '300000' }}

  electron-pack-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run dist --workspace=host-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: host-desktop-macos
          path: apps/host-desktop/release
          if-no-files-found: error

  sansio-determinism:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@twistedpear/effects --workspace=@twistedpear/protocol
      - run: npm run sansio:determinism
      - run: npm run sansio:canary

  freenet-local-network:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Download pinned Freenet node
        run: |
          mkdir -p .tmp/freenet-ci
          curl -L -o .tmp/freenet-ci/freenet.tar.gz \
            https://github.com/freenet/freenet-core/releases/download/v0.2.112/freenet-x86_64-unknown-linux-musl.tar.gz
          echo "b5b6bdf975c1563a98507e94c8edc1091278306e16f25ef216aacea1570a5571  .tmp/freenet-ci/freenet.tar.gz" | sha256sum --check
          tar -xzf .tmp/freenet-ci/freenet.tar.gz -C .tmp/freenet-ci
          chmod +x .tmp/freenet-ci/freenet
      - name: Record 100-sample local update-to-notify measurements
        run: npm run test:freenet-local-network
        env:
          FREENET_BINARY: ${{ github.workspace }}/.tmp/freenet-ci/freenet
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: freenet-measured-roundtrip
          path: .tmp/freenet-roundtrip-local-3-node.json
          if-no-files-found: error

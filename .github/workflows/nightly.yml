name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      soak_duration_ms:
        description: "SOAK_DURATION_MS for distribution soak"
        required: false
        default: "300000"
      desktop_soak_cycles:
        description: "DESKTOP_SOAK_CYCLES (864 for 72 h at 5 min/cycle)"
        required: false
        default: "5"
      link_soak_duration_ms:
        description: "LINK_SOAK_DURATION_MS (3600000 = 1 h plan exit)"
        required: false
        default: "300000"
      transport_soak_duration_ms:
        description: "TRANSPORT_SOAK_DURATION_MS (259200000 = 72 h plan exit)"
        required: false
        default: "300000"

jobs:
  dist-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:dist-soak
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  phase3-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run demo:phase3

  phase4-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run demo:phase4

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:examples

  miniapp-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:miniapp-soak
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  web-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:web-soak
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  harness-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:harness-install

  lan-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:lan-mirror

  integration-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration-soak
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  mixed-network-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:mixed-network-soak
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  ios-sim:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build leaf-echo
      - run: npm run test:ios-sim:required
        env:
          IOS_SIM_TCP_REQUIRED: "1"
          IOS_LIFECYCLE_CYCLES: "100"
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  upstream-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f conformance/docker/docker-compose.yml build --build-arg UNPINNED=1 leaf-echo lxmf-echo link-echo udp-echo resource-echo propagation-lxmd
      - run: INTEROP=1 npm run test:interop
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  ios-soak:
    runs-on: macos-15
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build leaf-echo
      - run: npm run test:ios-soak:required
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}
          IOS_LIFECYCLE_CYCLES: "100"
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  desktop-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 4500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:desktop-soak
        env:
          DESKTOP_SOAK_CYCLES: ${{ github.event.inputs.desktop_soak_cycles || '5' }}
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:widget-parity

  resource-interop-100mb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build resource-echo
      - run: INTEROP=1 npm run test:interop -- --testNamePattern="Resource transfer"
        env:
          RESOURCE_INTEROP_SIZES: "104857600"
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  link-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: INTEROP=1 npm run test:link-soak
        env:
          LINK_SOAK_DURATION_MS: ${{ github.event.inputs.link_soak_duration_ms || '300000' }}

  transport-node-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 4500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: INTEROP=1 npm run test:transport-node-soak
        env:
          TRANSPORT_SOAK_DURATION_MS: ${{ github.event.inputs.transport_soak_duration_ms || '300000' }}

  electron-pack-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run dist --workspace=host-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: host-desktop-macos
          path: apps/host-desktop/release
          if-no-files-found: error

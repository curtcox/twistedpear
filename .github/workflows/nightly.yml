name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      soak_duration_ms:
        description: "SOAK_DURATION_MS for distribution soak"
        required: false
        default: "300000"

jobs:
  dist-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:dist-soak
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  phase3-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run demo:phase3

  phase4-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run demo:phase4

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:examples

  miniapp-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:miniapp-soak
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}

  harness-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:harness-install

  ios-sim:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build leaf-echo
      - run: npm run test:ios-sim:required
        env:
          IOS_SIM_TCP_REQUIRED: "1"
          IOS_LIFECYCLE_CYCLES: "10"
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

  ios-soak:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: docker compose -f conformance/docker/docker-compose.yml up -d --build leaf-echo
      - run: npm run test:ios-soak:required
        env:
          SOAK_DURATION_MS: ${{ github.event.inputs.soak_duration_ms || '300000' }}
          IOS_LIFECYCLE_CYCLES: "100"
      - if: always()
        run: docker compose -f conformance/docker/docker-compose.yml down

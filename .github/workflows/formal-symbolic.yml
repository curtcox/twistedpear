name: Symbolic Formal Verification

on:
  pull_request:
    paths:
      - "formal/symbolic/**"
      - "formal/check-symbolic-models.mjs"
      - "formal/run-symbolic-provers.mjs"
      - ".github/workflows/formal-symbolic.yml"
  push:
    branches: [main]
    paths:
      - "formal/symbolic/**"
      - "formal/check-symbolic-models.mjs"
      - "formal/run-symbolic-provers.mjs"
      - ".github/workflows/formal-symbolic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: npm run formal:symbolic:lint
      - name: Prove Tamarin models
        run: nix shell nixpkgs#tamarin-prover -c npm run formal:tamarin
        env:
          SIM_EXPECTED_TAMARIN_VERSION: "1.12.0"
          SIM_SYMBOLIC_MODEL_TIMEOUT_MS: "300000"
      - name: Prove ProVerif models
        run: nix shell nixpkgs#proverif -c npm run formal:proverif
        env:
          SIM_SYMBOLIC_MODEL_TIMEOUT_MS: "300000"

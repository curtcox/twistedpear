<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>TwistedPear mini-app editor</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #07111b; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .editor-dialog {
        background: #0d1b29;
        border: 1px solid #2b3d4f;
        border-radius: 16px;
        padding: 20px;
        max-width: 480px;
        width: 100%;
      }
      @media (max-width: 760px) {
        #root > div > div:nth-child(2) { flex-direction: column; }
        #root > div > div:nth-child(2) > div { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>

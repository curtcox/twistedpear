appId: network.twistedpear.harness
---
# Device-run share-policy chrome: grant, revoke, TTL expiry, restart clearing.
# Seeds via harness test controls (device-test-seed-share / host chrome fallback).
# Expo development builds land on the launcher first — connect Metro before the harness UI.
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Development servers"
    commands:
      - tapOn: "http://localhost:8081"
# Expo dev-client first-run chrome after connecting Metro.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
# Connected Expo developer menu covers harness chrome — dismiss via backdrop tap.
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          point: "50%,12%"
- extendedWaitUntil:
    visible: "Create identity"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "seed-share-offer"
    direction: DOWN
    timeout: 30000
# Grant: seed a standing share and assert the persistent indicator.
- tapOn:
    id: "seed-share-offer"
- extendedWaitUntil:
    visible:
      id: "device-active-banner"
    timeout: 30000
- assertVisible:
    id: "device-stop-sharing"
# Revoke: one-click stop clears the indicator.
- tapOn:
    id: "device-stop-sharing"
- extendedWaitUntil:
    notVisible:
      id: "device-active-banner"
    timeout: 15000
# Expiry: short TTL clears chrome without a revoke tap.
- scrollUntilVisible:
    element:
      text: "Seed short share"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 40
- tapOn: "Seed short share"
- extendedWaitUntil:
    visible:
      id: "device-active-banner"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "device-active-banner"
    timeout: 15000
# Restart clearing: a live share must not survive a host relaunch.
- scrollUntilVisible:
    element:
      text: "Seed share offer"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 40
- tapOn: "Seed share offer"
- extendedWaitUntil:
    visible:
      id: "device-active-banner"
    timeout: 15000
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Development servers"
    commands:
      - tapOn: "http://localhost:8081"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          point: "50%,12%"
- extendedWaitUntil:
    visible: "Create identity"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "seed-share-offer"
    direction: DOWN
    timeout: 30000
- assertNotVisible:
    id: "device-active-banner"

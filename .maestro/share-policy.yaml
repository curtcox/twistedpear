appId: network.twistedpear.harness
---
# Device-run share-policy chrome: grant, revoke, TTL expiry, restart clearing.
# Seeds via harness test controls (device-test-seed-share); does not require a live peer.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "seed-share-offer"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "seed-share-offer"
    direction: DOWN
    timeout: 30000
# Grant: seed a standing share and assert the persistent indicator.
- tapOn:
    id: "seed-share-offer"
- extendedWaitUntil:
    visible:
      id: "device-active-banner"
    timeout: 15000
- assertVisible: "Ana"
- assertVisible: "microphone"
- assertVisible:
    id: "device-stop-sharing"
# Revoke: one-click stop clears the indicator.
- tapOn:
    id: "device-stop-sharing"
- extendedWaitUntil:
    notVisible:
      id: "device-active-banner"
    timeout: 15000
# Expiry: short TTL clears chrome without a revoke tap.
- scrollUntilVisible:
    element:
      id: "seed-share-offer-short"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "seed-share-offer-short"
- extendedWaitUntil:
    visible:
      id: "device-active-banner"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "device-active-banner"
    timeout: 15000
# Restart clearing: a live share must not survive a host relaunch.
- scrollUntilVisible:
    element:
      id: "seed-share-offer"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "seed-share-offer"
- extendedWaitUntil:
    visible:
      id: "device-active-banner"
    timeout: 15000
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "seed-share-offer"
    timeout: 60000
- assertNotVisible:
    id: "device-active-banner"

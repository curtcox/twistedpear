appId: network.twistedpear.harness
---
# Shared first-run chrome: Android 16 KB compat dialog + Expo dev-client connect.
- runFlow:
    when:
      visible: "Android App Compatibility"
    commands:
      - tapOn: "Don't Show Again"
- runFlow:
    when:
      visible: "Don't Show Again"
    commands:
      - tapOn: "Don't Show Again"
# Emulator hosts Metro on 10.0.2.2; iOS simulator uses localhost.
- runFlow:
    when:
      visible: "http://10.0.2.2:8081"
    commands:
      - tapOn: "http://10.0.2.2:8081"
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          point: "50%,12%"
# Cold Android Metro loads can take minutes on a 16 KB AVD.
- extendedWaitUntil:
    notVisible: "Bundling"
    timeout: 240000

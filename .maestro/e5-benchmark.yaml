appId: network.twistedpear.harness
---
- launchApp:
    clearState: true
- runFlow: dismiss-launch-chrome.yaml
- extendedWaitUntil:
    visible: "Create identity"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "benchmark-miniapp"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "benchmark-miniapp"
- extendedWaitUntil:
    visible:
      id: "benchmark-results"
    timeout: 120000
- assertVisible:
    text: "spawn"
- assertVisible:
    text: "busy-loop"
- assertVisible:
    text: "wasm yes"

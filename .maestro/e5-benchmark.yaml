appId: network.twistedpear.harness
---
- launchApp:
    clearState: true
- runFlow: dismiss-launch-chrome.yaml
- extendedWaitUntil:
    visible:
      id: "create-identity"
    timeout: 120000
- tapOn:
    id: "create-identity"
- extendedWaitUntil:
    visible: "Persisted: yes"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "freenet-grant-enable"
    direction: DOWN
    timeout: 120000
    speed: 40
    visibilityPercentage: 30
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: "benchmark-miniapp"
    direction: DOWN
    timeout: 60000
    speed: 40
    visibilityPercentage: 30
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "benchmark-miniapp"
- extendedWaitUntil:
    visible:
      id: "benchmark-log"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "benchmark-results"
    timeout: 120000

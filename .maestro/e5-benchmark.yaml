appId: network.twistedpear.harness
---
- launchApp:
    clearState: true
- runFlow: dismiss-launch-chrome.yaml
- extendedWaitUntil:
    visible:
      id: "create-identity"
    timeout: 120000
- tapOn:
    id: "create-identity"
# `status.running` stays false until an interface starts Reticulum. The isolate
# is live once identity persists; do not wait for "Worklet: running".
- extendedWaitUntil:
    visible: "Persisted: yes"
    timeout: 180000
# Benchmark sits on the relay card next to Create identity so Maestro does not
# have to scroll past hardware/mini-app cards (XCTest cannot tap off-screen ids).
- tapOn:
    id: "benchmark-miniapp"
- extendedWaitUntil:
    visible:
      id: "benchmark-results"
    timeout: 120000

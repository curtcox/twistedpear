<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Announce fan-out</title>
  <desc id="desc">Host A publishes an announce. Hosts in reach that are listening now hear it and store it; a host that was closed never hears it and its store diverges. There is no server, no retry, and no inbox.</desc>
  <style>
    :root{
      --bg:#f6f8fa;--panel:#ffffff;--ink:#1f2328;--muted:#656d76;--border:#d0d7de;
      --blue:#0969da;--green:#1a7f37;--red:#cf222e;--green-soft:#dafbe1;--red-soft:#ffebe9;--blue-soft:#ddf4ff;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#8b949e;--border:#30363d;
        --blue:#4493f8;--green:#3fb950;--red:#f85149;--green-soft:#12261a;--red-soft:#2d1416;--blue-soft:#11243e;
      }
    }
    .bg{fill:var(--bg);stroke:var(--border);}
    .panel{fill:var(--panel);stroke:var(--border);stroke-width:1.5;}
    .ink{fill:var(--ink);}
    .muted{fill:var(--muted);}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
    .h{font-size:21px;font-weight:700;}
    .sub{font-size:13.5px;}
    .lbl{font-size:14px;font-weight:600;}
    .sm{font-size:12px;}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;}
    .wave{fill:none;stroke:var(--blue);stroke-width:2;}
  </style>
  <rect class="bg" x="1" y="1" width="758" height="438" rx="12"/>

  <text class="t h ink" x="28" y="40">Announce = broadcast into a room</text>
  <text class="t sub muted" x="28" y="62">No server · no retry · no inbox. Heard by nobody = gone forever.</text>

  <!-- Publisher -->
  <rect class="panel" x="28" y="150" width="150" height="120" rx="9"/>
  <text class="t lbl ink" x="103" y="178" text-anchor="middle">Host A</text>
  <rect x="48" y="196" width="110" height="52" rx="6" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.2"/>
  <text class="t sm ink" x="103" y="216" text-anchor="middle">announce</text>
  <text class="t mono muted" x="103" y="236" text-anchor="middle">"9ft ladder…"</text>
  <text class="t sm muted" x="103" y="292" text-anchor="middle">publishes once</text>

  <!-- radio waves -->
  <path class="wave" d="M188 210 A44 44 0 0 1 188 290" opacity="0.9"/>
  <path class="wave" d="M188 190 A74 74 0 0 1 188 310" opacity="0.6"/>
  <path class="wave" d="M188 170 A104 104 0 0 1 188 330" opacity="0.35"/>

  <!-- Receiver B: heard -->
  <g>
    <line x1="300" y1="150" x2="512" y2="130" stroke="var(--green)" stroke-width="2"/>
    <rect class="panel" x="512" y="96" width="216" height="76" rx="9"/>
    <text class="t lbl ink" x="528" y="123">Host B</text>
    <rect x="622" y="106" width="94" height="22" rx="11" fill="var(--green-soft)" stroke="var(--green)" stroke-width="1"/>
    <text class="t sm" x="669" y="121" text-anchor="middle" fill="var(--green)">listening ✓</text>
    <rect x="528" y="136" width="188" height="26" rx="5" fill="var(--green-soft)"/>
    <text class="t mono ink" x="538" y="153">store ▸ "9ft ladder…"</text>
  </g>

  <!-- Receiver C: heard -->
  <g>
    <line x1="300" y1="240" x2="512" y2="240" stroke="var(--green)" stroke-width="2"/>
    <rect class="panel" x="512" y="202" width="216" height="76" rx="9"/>
    <text class="t lbl ink" x="528" y="229">Host C</text>
    <rect x="622" y="212" width="94" height="22" rx="11" fill="var(--green-soft)" stroke="var(--green)" stroke-width="1"/>
    <text class="t sm" x="669" y="227" text-anchor="middle" fill="var(--green)">listening ✓</text>
    <rect x="528" y="242" width="188" height="26" rx="5" fill="var(--green-soft)"/>
    <text class="t mono ink" x="538" y="259">store ▸ "9ft ladder…"</text>
  </g>

  <!-- Receiver D: missed -->
  <g>
    <line x1="300" y1="330" x2="512" y2="350" stroke="var(--red)" stroke-width="2" stroke-dasharray="6 5"/>
    <text class="t lbl" x="404" y="352" text-anchor="middle" fill="var(--red)">✕</text>
    <rect class="panel" x="512" y="308" width="216" height="76" rx="9"/>
    <text class="t lbl ink" x="528" y="335">Host D</text>
    <rect x="622" y="318" width="94" height="22" rx="11" fill="var(--red-soft)" stroke="var(--red)" stroke-width="1"/>
    <text class="t sm" x="669" y="333" text-anchor="middle" fill="var(--red)">closed ✕</text>
    <rect x="528" y="348" width="188" height="26" rx="5" fill="var(--red-soft)"/>
    <text class="t mono muted" x="538" y="365">store ▸ (never heard it)</text>
  </g>

  <text class="t sm muted" x="28" y="418">Each host's store is only what that host heard — so no two hosts are guaranteed to agree.</text>
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>TwistedPear React Native Web samples</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #07111b; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      @media (max-width: 760px) {
        #root > div > div:last-child { flex-direction: column; }
        #root > div > div:last-child > div:first-child { width: 100%; max-height: 230px; overflow: auto; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /packages/bridge-freenet/contract/locator
    schedule:
      interval: weekly
    groups:
      rust-contracts:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /packages/bridge-freenet/contract/packet-log
    schedule:
      interval: weekly
    groups:
      rust-contracts:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /packages/bridge-freenet/contract/propagation-set
    schedule:
      interval: weekly
    groups:
      rust-contracts:
        patterns: ["*"]

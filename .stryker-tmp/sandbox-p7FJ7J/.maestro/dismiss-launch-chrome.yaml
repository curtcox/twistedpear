appId: network.twistedpear.harness
---
# Shared first-run chrome: system ANRs, Android 16 KB compat, Expo Continue/Reload.
# Emulators under load often ANR the Pixel Launcher mid-boot — keep tapping Wait.
- repeat:
    times: 5
    while:
      visible: "Close app"
    commands:
      - tapOn: "Wait"
      - waitForAnimationToEnd:
          timeout: 1000
- runFlow:
    when:
      visible: "Android App Compatibility"
    commands:
      - tapOn: "Don't Show Again"
- runFlow:
    when:
      visible: "Don't Show Again"
    commands:
      - tapOn: "Don't Show Again"
# Expo development builds land on the launcher first — connect Metro.
# Prefer 127.0.0.1 when adb reverse is set; fall back to 10.0.2.2 / localhost.
- runFlow:
    when:
      visible: "Development servers"
    commands:
      - runFlow:
          when:
            visible: "http://127.0.0.1:8081"
          commands:
            - tapOn: "http://127.0.0.1:8081"
      - runFlow:
          when:
            visible: "http://localhost:8081"
          commands:
            - tapOn: "http://localhost:8081"
      - runFlow:
          when:
            visible: "http://10.0.2.2:8081"
          commands:
            - tapOn: "http://10.0.2.2:8081"
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 120000
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
# Do not tap the top Reload banner here — on Android that opens the Expo Dev
# Menu and hides harness chrome. Share-policy waits on text and survives a
# brief menu flash; local-peer-up dismisses the menu explicitly instead.
- extendedWaitUntil:
    notVisible: "Bundling"
    timeout: 240000
- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - pressKey: back
- runFlow:
    when:
      visible: "Close app"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
